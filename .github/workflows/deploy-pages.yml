name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /multi-robot-planner/
      - name: Build mobile bundle (subpath)
        run: npx vite build --outDir dist/mobile
        env:
          VITE_BASE: /multi-robot-planner/mobile/
      - name: Verify wizard UI in bundles (not legacy loading overlay)
        run: |
          if grep -rq 'Calculating paths + energy costs' dist/; then
            echo 'Legacy static loading text found in build output.'
            exit 1
          fi
          if ! grep -rq 'Running planners' dist/; then
            echo 'Wizard loading UI missing from build output.'
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
